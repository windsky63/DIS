services:
  drawing-mark-recognition:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${DRAWING_MARK_RECOGNITION_VERSION:-2.0.10}"
        BUILD_ID: "${DRAWING_MARK_RECOGNITION_BUILD_ID:-manual}"
        NODE_IMAGE: "${DRAWING_MARK_RECOGNITION_NODE_IMAGE:-node:24-bookworm-slim}"
        PYTHON_IMAGE: "${DRAWING_MARK_RECOGNITION_PYTHON_IMAGE:-python:3.14-slim-bookworm}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    image: "drawing-mark-recognition:${DRAWING_MARK_RECOGNITION_VERSION:-2.0.10}"
    pull_policy: build
    container_name: drawing-mark-recognition
    init: true
    restart: unless-stopped
    ports:
      - "${DRAWING_MARK_RECOGNITION_PORT:-8768}:8768"
    environment:
      DRAWING_MARK_RECOGNITION_VERSION: "${DRAWING_MARK_RECOGNITION_VERSION:-2.0.10}"
      DRAWING_MARK_RECOGNITION_BUILD_ID: "${DRAWING_MARK_RECOGNITION_BUILD_ID:-manual}"
      DRAWING_MARK_RECOGNITION_ALGORITHM_VERSION: "${DRAWING_MARK_RECOGNITION_ALGORITHM_VERSION:-2026-09-08.1}"
      DRAWING_MARK_RECOGNITION_SESSION_SECURE: "${DRAWING_MARK_RECOGNITION_SESSION_SECURE:-false}"
      DRAWING_MARK_RECOGNITION_MAX_BODY_MB: "${DRAWING_MARK_RECOGNITION_MAX_BODY_MB:-350}"
      DRAWING_MARK_RECOGNITION_MAX_UPLOAD_FILE_MB: "${DRAWING_MARK_RECOGNITION_MAX_UPLOAD_FILE_MB:-350}"
      DRAWING_MARK_RECOGNITION_MAX_CONCURRENT_UPLOADS: "${DRAWING_MARK_RECOGNITION_MAX_CONCURRENT_UPLOADS:-2}"
      DRAWING_MARK_RECOGNITION_MIN_FREE_DISK_MB: "${DRAWING_MARK_RECOGNITION_MIN_FREE_DISK_MB:-512}"
      DRAWING_MARK_RECOGNITION_UPLOAD_RETENTION_HOURS: "${DRAWING_MARK_RECOGNITION_UPLOAD_RETENTION_HOURS:-24}"
      DRAWING_MARK_RECOGNITION_MAX_CONCURRENT_ANALYSES: "${DRAWING_MARK_RECOGNITION_MAX_CONCURRENT_ANALYSES:-1}"
      DRAWING_MARK_RECOGNITION_MAX_PENDING_ANALYSES: "${DRAWING_MARK_RECOGNITION_MAX_PENDING_ANALYSES:-4}"
      DRAWING_MARK_RECOGNITION_JOB_RETENTION_DAYS: "${DRAWING_MARK_RECOGNITION_JOB_RETENTION_DAYS:-90}"
      DRAWING_MARK_RECOGNITION_AUDIT_MAX_MB: "${DRAWING_MARK_RECOGNITION_AUDIT_MAX_MB:-10}"
      DRAWING_MARK_RECOGNITION_AUDIT_BACKUPS: "${DRAWING_MARK_RECOGNITION_AUDIT_BACKUPS:-5}"
      DRAWING_MARK_RECOGNITION_AI_PROVIDER: "${DRAWING_MARK_RECOGNITION_AI_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_API_URL: "${DEEPSEEK_API_URL:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-}"
      DRAWING_MARK_RECOGNITION_AI_API_URL: "${DRAWING_MARK_RECOGNITION_AI_API_URL:-}"
      DRAWING_MARK_RECOGNITION_AI_API_KEY: "${DRAWING_MARK_RECOGNITION_AI_API_KEY:-}"
      DRAWING_MARK_RECOGNITION_AI_MODEL: "${DRAWING_MARK_RECOGNITION_AI_MODEL:-}"
    volumes:
      - drawing-mark-recognition-data:/app/data

  drawing-mark-recognition-worker:
    image: "drawing-mark-recognition:${DRAWING_MARK_RECOGNITION_VERSION:-2.0.10}"
    pull_policy: never
    init: true
    restart: unless-stopped
    command: ["backend/worker.py", "--lease-seconds", "60"]
    environment:
      DRAWING_MARK_RECOGNITION_VERSION: "${DRAWING_MARK_RECOGNITION_VERSION:-2.0.10}"
      DRAWING_MARK_RECOGNITION_BUILD_ID: "${DRAWING_MARK_RECOGNITION_BUILD_ID:-manual}"
      DRAWING_MARK_RECOGNITION_ALGORITHM_VERSION: "${DRAWING_MARK_RECOGNITION_ALGORITHM_VERSION:-2026-09-08.1}"
    volumes:
      - drawing-mark-recognition-data:/app/data
    depends_on:
      drawing-mark-recognition:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 30m

volumes:
  drawing-mark-recognition-data:
